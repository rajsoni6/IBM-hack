submission:
  title: "Cyber Fraud Network Analyzer — Powered by IBM Bob"

  problem_statement: >
    In FY2023, the Jamtara SIM-swap ring in Jharkhand caused 95,000+ UPI fraud cases across India.
    Investigators had to manually trace connections between bank accounts, SIM cards, and devices
    over weeks, with most cases going unsolved due to the complete absence of network visualization
    and automated intelligence tools.

  solution_summary: >
    We built a Bob-powered cyber fraud investigation platform that ingests unstructured intelligence
    (transaction records, call logs, device IDs, accused names) and automatically extracts entities,
    identifies the fraud pattern type (SIM Swap, Phishing, Mule Network, etc.), maps the full
    organizational hierarchy from Kingpin down to Victim, and generates a structured FIR-ready
    case brief with applicable IPC/IT Act sections and recommended investigative actions — all
    in under 3 seconds.

  key_features:
    - "IBM Bob AI entity extraction — persons, accounts, phones, devices, IPs, crypto wallets from raw text"
    - "Fraud pattern classifier — 7 pattern types including Hybrid detection using ML + rule-based scoring"
    - "Organizational hierarchy mapper — auto-classifies Kingpin / Coordinator / Mule / Victim from unstructured data"
    - "FIR-ready case brief generator — structured draft with IPC §420, IT Act §66C, PMLA §3/§4 sections"
    - "Interactive Cytoscape.js network graph — color-coded fraud network visualization with relationship edges"

  tech_stack:
    languages: ["Python", "TypeScript"]
    frameworks: ["Flask", "React", "Vite", "Tailwind CSS", "Flask Blueprints"]
    ibm_technologies: ["IBM Bob", "watsonx.ai", "ibm/granite-13b-instruct-v2"]
    databases: []
    other: ["Pandas", "NumPy", "scikit-learn", "XGBoost", "NetworkX", "Cytoscape.js",
            "Recharts", "Axios", "React Router", "python-dotenv", "Pydantic",
            "flask-cors", "JSON file storage", "CSV file storage"]

  what_we_are_most_proud_of: >
    The end-to-end pipeline — from pasting raw unstructured intelligence text to a fully structured
    FIR-ready case brief with an interactive network graph in under 3 seconds. The hierarchy builder
    that automatically identifies the Kingpin → Coordinator → Mule → Victim chain from unstructured
    data is our core innovation, directly addressing the Jamtara investigators' biggest pain point.
    We also trained on a real CSV dataset of 50 fraud patterns across 10,000+ accounts to validate
    the ML classifier.

  known_limitations: >
    Authentication is mocked and not production-ready. IBM Bob LLM integration uses rule-based
    regex in Phase 1 — full watsonx.ai enrichment is Phase 8. The system has only been tested
    with 3 mock cases and the provided CSV dataset. Network graph performance may degrade beyond
    500 nodes. FIR drafts require manual review by a qualified officer before official submission.

